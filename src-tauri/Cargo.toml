[package]
name = "recavo-desktop"
version = "0.1.0"
description = "RECAVO desktop shell (Tauri)"
edition = "2021"
publish = false

[lib]
name = "recavo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
serde_json = "1"
url = "2"

# Size over speed: the shell does almost nothing itself, the web app does the work.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
