<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>RECAVO Portal</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b0f;
        color: #e5e7eb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!--
      Local splash fallback. The native shell loads the live portal via
      server.url in capacitor.config.ts; this screen shows only briefly while
      the remote page loads, or if the device is offline.
    -->
    <div class="wrap">
      <div class="spinner"></div>
      <div>Loading RECAVO Portal…</div>
    </div>
  </body>
</html>
